name: Vector.ai
description: Vector.ai, now operating as Raft (raft.ai), is an AI-powered logistics
  automation platform for freight forwarders, customs brokers, and trade finance
  teams. The Raft Intelligence Engine layers organization data, contextual LLMs,
  orchestration, and specialized governed agents to automate document processing,
  invoice matching, data extraction, and exception handling across supply chain
  operations, reporting 20M+ tasks completed by AI agents and 5M+ shipments
  processed annually. Raft publishes no public developer API; the platform is an
  enterprise application that integrates with customers' TMS and ERP systems.
